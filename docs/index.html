.symbol{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;word-wrap:normal;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;display:inline-block}

/* ConfigProvider-ready foundations: colors, spacing, type and control geometry. */
:root{--navy:#122440;--brand:#2457d6;--teal:#168a9c;--accent:#126b78;--paper:#f4f7fb;--white:#fff;--soft:#eaf0ff;--line:#dce4ef;--ink:#17263d;--muted:#52647b;--danger:#b42318;--action:#292D32;--action-hover:#15181C;--card-border:#E2E6EB;--card-shadow:0 4px 18px rgba(23,38,61,.035);--radius:16px;--space:8px;--control:44px;--sidebar:240px}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 system-ui,-apple-system,'Noto Sans Devanagari','Nirmala UI',sans-serif}
button,input,select,textarea{font:inherit}
button,a{cursor:pointer}
button{color:inherit;border:0}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
button:disabled{cursor:not-allowed}
button:disabled,input:disabled{background:#edf1f6!important;color:var(--muted)!important;border-color:var(--line)!important}
h1,h2,h3,p{margin:0}
h1{font-size:30px;line-height:1.35;letter-spacing:-.6px;font-weight:650;margin-bottom:10px}
h2{font-size:20px;line-height:1.5;font-weight:650;margin-bottom:12px}
h3{font-size:16px;font-weight:650;margin-bottom:6px}
p{margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:1.3px;font-weight:700;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip-link{position:fixed;top:-80px;left:16px;z-index:20;padding:12px;background:white;color:var(--brand)}
.skip-link:focus{top:12px}

/* AppShell / AppSidebar / AppHeader */
aside{position:fixed;inset:0 auto 0 0;width:var(--sidebar);padding:28px 16px 20px;background:var(--navy);color:white;display:flex;flex-direction:column;z-index:4;overflow:auto}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;flex-shrink:0;color:var(--brand)}
aside .mark{color:#78ded0}
.brand strong{display:block;font-size:20px;font-weight:700;letter-spacing:-.6px;line-height:1.3}
.brand small{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
aside .brand{padding:0 8px}
aside .brand small,aside .aside-bottom{color:#b9c9dd}
#side-nav{display:grid;gap:4px;margin-top:32px}
#side-nav button{display:flex;align-items:center;gap:12px;min-height:44px;background:transparent;color:#c6d3e4;border-radius:6px;text-align:left;padding:10px 12px;border-left:3px solid transparent}
#side-nav button:hover{background:#1c3555}
#side-nav button.active{color:white;background:#23415f;border-left-color:#78ded0;font-weight:600}
.ico{display:inline-grid;place-items:center;width:22px;flex-shrink:0;font-size:20px}
.aside-bottom{margin-top:auto;padding:40px 10px 0;font-size:12px}
.aside-bottom strong{display:block;color:white;font-size:13px}
.divider{height:1px;background:var(--line);margin:22px 0}
aside .divider{background:#344760}
main{margin-left:var(--sidebar);min-width:0}
header{min-height:72px;padding:12px 36px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}
.breadcrumb{font-size:12px;color:var(--muted)}
.right{display:flex;align-items:center;gap:16px}
.lang{min-height:44px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:white;color:var(--ink)}
.avatar{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.preview-label{font-size:11px;color:var(--muted)}
.mobile-brand,.bottom-nav{display:none}
.content{max-width:1240px;margin:auto;padding:28px 36px 48px}
.page-heading{margin-bottom:24px}
.page-heading p:last-child{margin:0}

/* Shared controls and surfaces */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--control);padding:10px 18px;border:1px solid var(--action);border-radius:9px;background:var(--action);color:white;font-size:14px;line-height:1.5;font-weight:600;text-decoration:none;transition:background .18s,border-color .18s,box-shadow .18s}
.btn:hover:not(:disabled){background:var(--action-hover);border-color:var(--action-hover)}
.btn.secondary{background:white;color:var(--action);border-color:#D6DAE0}
.btn.secondary:hover:not(:disabled){background:#F6F7F8;border-color:#AEB5BE}
.btn.ghost{color:var(--action);background:transparent;border-color:transparent;padding:8px}
.btn.ghost:hover:not(:disabled){background:#ECEFF2;border-color:transparent}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.card{background:white;border:1px solid var(--card-border);border-radius:var(--radius);padding:24px;min-width:0;box-shadow:var(--card-shadow)}
.badge{display:inline-block;padding:3px 9px;border-radius:4px;background:var(--soft);color:#234b9d;font-size:11px;font-weight:650}

footer{font-size:12px;color:var(--muted);margin-top:24px}

/* HeroSection / ServiceRow / QuotaSummary / ConsultantCard */
.hero{position:relative;min-height:254px;background:linear-gradient(115deg,#DDE9FF 0%,#EDF4FF 52%,#FFFFFF 100%);color:var(--ink);border:1px solid #D5E1F3;border-radius:var(--radius);padding:32px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;align-items:center;overflow:hidden}

.hero .btn.secondary:hover{background:#F0F2F4;border-color:#F0F2F4}
/* Shared desktop/mobile treatment: faded artwork cropped at the top-right. */
.hero-copy{position:relative;z-index:1}
.cosmos{width:220px;height:220px;position:absolute;right:-60px;top:-50px;opacity:.2;display:grid;place-items:center;margin:0;pointer-events:none}

.section-top{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}

.grid{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:white}
.service{box-shadow:none;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 18px;min-height:76px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:0 16px;align-items:center}

.service:focus-visible{outline-offset:-3px}
.service-icon{width:40px;height:40px;display:grid;place-items:center;background:#F0F2F4;color:var(--action);border-radius:10px;font-size:22px;flex-shrink:0}
.service .service-icon{grid-row:1/3}
.service h3{margin:0;font-size:15px}
.service p{grid-column:2;margin:2px 0 0;font-size:13px;color:var(--muted)}
.service .arrow{grid-column:3;grid-row:1/3;color:var(--action);font-size:12px;font-weight:600}
.usage{margin-top:20px;padding:24px;background:white;border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--card-shadow)}
.trial-heading{display:flex;gap:12px;align-items:center;margin-bottom:20px}.trial-heading h3{margin:0;font-size:17px}.trial-heading p{margin:3px 0 0}.trial-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#F0F2F4;color:var(--action);flex-shrink:0}
.trial-balances{display:grid;grid-template-columns:1fr 1fr;gap:16px}.trial-balance{border:1px solid #E8EBEF;border-radius:12px;background:#FAFBFC;padding:16px 18px;min-width:0}.trial-category{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--action)}.trial-category .symbol{font-size:18px}.trial-value{display:flex;align-items:baseline;gap:12px;justify-content:space-between;margin:10px 0}.trial-value strong{font-size:28px;line-height:1.3;font-weight:650;color:var(--action);white-space:nowrap}.trial-value small{font-size:15px;font-weight:400;color:var(--muted)}.trial-value>span{color:var(--muted);font-size:12px;text-align:right}.trial-balance meter{display:block;width:100%;height:6px}.trial-balance meter::-webkit-meter-bar{background:#E6E9ED;border:0;border-radius:4px}.trial-balance meter::-webkit-meter-optimum-value{background:var(--action)}.trial-balance meter::-moz-meter-bar{background:var(--action)}.trial-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px}
.quota-metrics{display:flex;gap:28px;margin:12px 0}
.quota-metric{min-width:100px;flex:1}
.quota-metric strong{font-size:22px;line-height:1.2}
.quota-metric span{display:block;color:var(--muted);font-size:12px}
.quota-metric meter{width:100%;height:6px;display:block;margin-top:8px;accent-color:var(--teal)}
.consult{display:flex;align-items:center;gap:16px;margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
.portrait{width:48px;height:48px;flex-shrink:0;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--brand);display:grid;place-items:center;font-size:18px}
.consult p{margin:0}
.consult .btn{margin-left:auto}

/* BirthDetailsForm / VastuForm / PrashnaForm */
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.field{min-width:0}
.field.full{grid-column:1/-1}
label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
input,textarea,.field select{width:100%;min-width:0;min-height:var(--control);border:1px solid #b6c4d6;border-radius:6px;padding:10px 12px;background:white;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
textarea{min-height:110px;resize:vertical}
.check{display:flex;align-items:flex-start;gap:10px;font-weight:400;margin:18px 0;font-size:13px;cursor:pointer}
.check input{width:18px;min-height:18px;height:18px;flex-shrink:0;margin:2px 0;accent-color:var(--brand)}
.field .check{margin:0;min-height:26px}
.field-error{display:block;color:var(--danger);font-size:12px;margin-top:5px}
[aria-invalid=true]{border-color:var(--danger)}
.required{color:var(--danger);margin-left:3px}
.steps{list-style:none;counter-reset:step;padding:0;margin:18px 0}
.steps li{counter-increment:step;position:relative;padding:0 0 24px 36px;font-size:13px}
.steps li:before{content:counter(step);position:absolute;left:0;top:0;width:24px;height:24px;background:var(--soft);color:var(--brand);display:grid;place-items:center;border-radius:50%}
.steps li:last-child{padding-bottom:0}

/* AIChatPanel / ChatMessage / ChatComposer */
.chat{display:flex;flex-direction:column;padding:0;overflow:hidden;min-height:510px}
.chat-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.chat-body{padding:20px;flex:1;max-height:540px;overflow:auto;overflow-wrap:anywhere}
.bubble{padding:16px;background:#eff3f9;border:1px solid var(--line);border-radius:2px 8px 8px 8px;max-width:94%;font-size:14px}
.bubble.user{margin:20px 0 16px auto;background:var(--navy);color:white;border-color:var(--navy);border-radius:8px 2px 8px 8px}
.message-label{display:block;font-size:11px;font-weight:600;margin-bottom:6px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{min-height:44px;border:1px solid var(--line);background:white;border-radius:6px;padding:9px 12px;text-align:left;color:var(--brand);font-size:12px}
.chip:hover{background:var(--soft)}
.chat-compose{padding:14px;border-top:1px solid var(--line);display:flex;gap:8px}
.chat-compose input{flex:1;min-width:0}
.composer-help{padding:0 14px 12px;font-size:12px;color:var(--muted);margin:0}
.chat-disclaimer{margin:0;border-radius:0;border:0;border-bottom:1px solid var(--line);font-size:12px;padding:12px 20px}
.loading{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}
}

/* PricingPlanCard / ContactProfile / Modal */
/* PricingPlanCard: shared header, price block, benefits and anchored action. */
.plan-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding-top:12px;align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;padding:28px 22px 22px;transition:border-color .18s,box-shadow .18s}
.plan:hover{border-color:#B8C0CA;box-shadow:0 8px 24px rgba(23,38,61,.065)}
.plan.rec{border-color:var(--action);box-shadow:0 0 0 1px var(--action),0 8px 24px rgba(23,38,61,.07)}
.plan.rec .badge{position:absolute;top:0;left:22px;transform:translateY(-50%);padding:4px 12px;border-radius:20px;background:var(--action);color:white;border:3px solid var(--paper);font-size:11px;line-height:1.4;max-width:calc(100% - 44px)}
.plan-heading{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.plan-heading h2{font-size:17px;margin:0;letter-spacing:-.3px}
.plan-symbol{width:32px;height:32px;display:grid;place-items:center;background:#F3F4F6;border:1px solid #E7E9ED;border-radius:9px;color:var(--action);flex-shrink:0}

.plan.rec .plan-symbol{background:#E9ECEF;border-color:#D9DDE2}
.plan-price{padding-bottom:22px;border-bottom:1px solid #ECEEF1}
.price{font-size:40px;line-height:1.2;font-weight:650;letter-spacing:-1.7px;margin:0 0 8px;color:var(--action);font-variant-numeric:tabular-nums}
.price .currency{font-size:26px;vertical-align:4px;margin-right:2px;font-weight:500}
.plan ul{list-style:none;margin:20px 0 26px;padding:0;font-size:13px;display:grid;gap:14px}
.plan li{display:flex;align-items:baseline;gap:10px;line-height:1.5}
.plan li:before{content:'✓';color:#52647B;font-size:12px;font-weight:600;flex-shrink:0}
.plan li.zero:before{content:'—';color:#75808D}
.plan li strong{font-weight:650}
.plan .btn{width:100%;margin-top:auto;padding:11px 8px;min-height:46px}
.contact-hero{max-width:780px;margin:auto;text-align:center;padding:36px}

.quota-metric meter::-webkit-meter-optimum-value{background:var(--teal)}
.quota-metric meter::-moz-meter-bar{background:var(--teal)}

  <ul><li><span><strong>${a}</strong> ${t.ai}</span></li><li><span><strong>${c}</strong> ${t.charts}</span></li><li class="${v===0?'zero':''}"><span><strong>${v}</strong> ${t.vastus}</span></li><li><span>${t.allLang}</span></li></ul><button class="btn ${i!==2?'secondary':''}" ${i===0?'disabled':`data-plan="${n}"`}>${i===0?t.current:t.choose}</button></section>`).join('')}</div><div class="note">${t.planNote}</div><p class="small muted">${t.contactNote}</p>`}

if(page==='contact'){h=heading(t.contactTitle,t.contactSub)+`<section class="card contact-hero"><div class="portrait" aria-hidden="true">JM</div><p class="eyebrow">${t.business}</p><h1>${t.name}</h1><p class="muted">${t.bio}</p><span class="badge">${t.contactLanguages}</span><div class="actions" style="justify-content:center"><a class="btn" href="https://wa.me/919322100684" target="_blank" rel="noopener noreferrer">${t.whatsapp} ↗</a><a class="btn secondary" href="tel:+919322100684">${t.call}</a></div><p class="muted" style="margin-top:20px">+91 93221 00684</p><div class="divider"></div><p class="small muted">${t.contactNote}</p></section>`}

if(page==='more'){h=heading(t.more,'Shubh Vastu AI Astro')+`<div class="more-links">${['prashna','plans','contact'].map(id=>`<button data-go="${id}">${t.nav[ids.indexOf(id)]} →</button>`).join('')}</div>`}view.innerHTML=h+(page==='guru'?'':`<footer>${t.prototypeNote}</footer>`);restoreDraft();enhance();bind();}
function syncUnknown(){let c=document.querySelector('#unknown');if(!c)return;
document.querySelector('#time').disabled=c.checked;
document.querySelector('#time').required=!c.checked;
document.querySelector('#generate').disabled=c.checked||busy.has('birth');
document.querySelector('#unknown-note').hidden=!c.checked}
// Form state remains in memory only. No personal data is persisted or transmitted.
function enhance(){
 document.querySelector('.skip-link').textContent=UI[lang].skip;
 document.querySelector('#side-nav').setAttribute('aria-label',T[lang].nav[0]);
 document.querySelectorAll('#bottom-nav button.active').forEach(el=>el.setAttribute('aria-current','page'));
 view.querySelectorAll('h1')[0]?.setAttribute('tabindex','-1');
 view.querySelectorAll('[required]').forEach(el=>{
  const label=view.querySelector(`label[for="${el.id}"]`);
  if(label && el.id!=='question') label.insertAdjacentHTML('beforeend',`<span class="required" aria-hidden="true"> *</span><span class="sr-only"> ${UI[lang].required}</span>`);
 });
 const dob=document.querySelector('#dob');
 if(dob){const now=new Date();dob.max=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
document.querySelector('#time').setAttribute('aria-describedby','unknown-note');
document.querySelector('#generate').setAttribute('aria-describedby','unknown-note');}
 if(results.has(page)) document.querySelector('#form-result').innerHTML=status();
 
if(page==='vastu'&&!results.has(page)) document.querySelector('#form-result').innerHTML=status();
 
if(page==='guru') drawMessages();
 if(busy.has(page)) setBusy(page,true);
}
function drawMessages(){
 const messages=document.querySelector('#messages');if(!messages)return;
 messages.querySelectorAll('[data-message]').forEach(el=>el.remove());
 chatHistory.forEach(message=>{
  const block=document.createElement('div');block.dataset.message='true';block.className=message.role==='user'?'bubble user':'status error';
  const label=document.createElement('span');label.className='message-label';label.textContent=message.role==='user'?UI[lang].you:T[lang].guruTitle+' · '+T[lang].preview;block.append(label);
  block.append(document.createTextNode(message.role==='user'?message.text:UI[lang].error));messages.append(block);
 });
 messages.scrollTop=messages.scrollHeight;
}
function setBusy(target,active){
 if(page!==target)return;
 const form=view.querySelector('form');if(!form)return;
 form.setAttribute('aria-busy',String(active));
 const button=form.querySelector('button[type="submit"],button:not([type])');
 button.disabled=active;button.innerHTML=active?`<span class="loading" aria-hidden="true"></span>${UI[lang].loading}`:T[lang][target==='guru'?'send':target==='birth'?'generate':'vastuButton'];
 if(!active&&target==='guru')updateComposer();
 if(!active&&target==='birth')syncUnknown();
}
function updateComposer(){const input=document.querySelector('#question');if(input)document.querySelector('#chat-form button').disabled=!input.value.trim()||busy.has('guru')}
function validate(form){
 let first=null;
 form.querySelectorAll('input,select,textarea').forEach(el=>{
  document.getElementById(el.id+'-error')?.remove();el.removeAttribute('aria-invalid');
  const prior=(el.getAttribute('aria-describedby')||'').split(' ').filter(x=>x&&x!==el.id+'-error');
  el.setAttribute('aria-describedby',prior.join(' '));
  const emptyText=el.required&&!el.disabled&&el.type!=='checkbox'&&!el.value.trim();
  if(!el.checkValidity()||emptyText){
   const error=document.createElement('span');error.id=el.id+'-error';error.className='field-error';error.textContent=el.type==='checkbox'?T[lang].formConsent:UI[lang].invalid+' '+(el.validationMessage||UI[lang].required);
   (el.type==='checkbox'?el.closest('label'):el).after(error);el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby',[...prior,error.id].join(' '));first??=el;
  }
 });first?.focus();return !first;
}
function bind(){
 document.querySelector('#unknown')?.addEventListener('change',syncUnknown);
 for(const id of ['birth-form','vastu-form']){
  const form=document.getElementById(id);if(!form)continue;form.noValidate=true;
  form.addEventListener('submit',e=>{
   e.preventDefault();if(busy.has(page)||!validate(form))return;
   saveDraft();
const target=page;busy.add(target);setBusy(target,true);
   setTimeout(()=>{busy.delete(target);results.add(target);
if(page===target){setBusy(target,false);
document.querySelector('#form-result').innerHTML=status();}},650);
  });
 }
 document.querySelector('#question')?.addEventListener('input',updateComposer);updateComposer();
 document.querySelector('#chat-form')?.addEventListener('submit',e=>{
  e.preventDefault();
const input=document.querySelector('#question');if(!input.value.trim()||busy.has('guru'))return;
  chatHistory.push({role:'user',text:input.value.trim()});input.value='';saveDraft();drawMessages();busy.add('guru');setBusy('guru',true);
  setTimeout(()=>{chatHistory.push({role:'assistant'});busy.delete('guru');
if(page==='guru'){drawMessages();setBusy('guru',false)}},650);
 });
}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){saveDraft();page=go.dataset.go;render();view.querySelector('h1')?.focus({preventScroll:true});window.scrollTo(0,0)}const plan=e.target.closest('[data-plan]');if(plan){document.querySelector('#dialog-title').textContent=T[lang].paymentTitle+' — '+plan.dataset.plan;
document.querySelector('#dialog-body').textContent=T[lang].paymentBody;
document.querySelector('#dialog').showModal()}const s=e.target.closest('[data-suggest]');if(s){document.querySelector('#question').value=T[lang].suggestions[+s.dataset.suggest];
document.querySelector('#question').focus();updateComposer()}});
document.querySelector('#language').addEventListener('change',e=>{saveDraft();lang=e.target.value;render()});
document.querySelector('#nav-toggle').addEventListener('click',()=>{navExpanded=!navExpanded;syncNavDrawer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&navExpanded&&!document.querySelector('dialog').open){navExpanded=false;syncNavDrawer();if(page!=='guru')document.querySelector('#nav-toggle').focus()}});
document.querySelector('#close-dialog').addEventListener('click',()=>document.querySelector('#dialog').close());render();
</script>
</body>
</html>
